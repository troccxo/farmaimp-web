<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <!-- Política de seguridad de contenido.

         Va en <meta> y no como cabecera HTTP porque el portal se publica en
         GitHub Pages, que no deja configurar cabeceras. Tiene que ir ACÁ
         ARRIBA: una CSP en meta sólo rige para lo que viene después de ella.

         Lo que esta vía NO puede dar, porque el navegador lo ignora en meta:
         `frame-ancestors`, `report-to` y `sandbox`. El único que importa es el
         primero —evitar que alguien empotre el portal en un iframe— y por eso
         más abajo hay un guard en JavaScript que lo cubre a mano.

         `style-src` lleva 'unsafe-inline' y no hay forma de evitarlo: las
         pantallas usan `style={{...}}` de React, que son atributos style en el
         DOM. Sacarlo obligaría a reescribir todo a clases. No es el vector que
         importa: el peligroso es el script, y ése queda sin excepciones.

         Si algún día se usa Realtime hay que sumar `wss://…supabase.co` a
         connect-src, y si se muestran miniaturas desde Storage, el dominio a
         img-src. Hoy no aplica ninguna de las dos. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none';
               script-src 'self';
               style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
               font-src https://fonts.gstatic.com;
               img-src 'self' data:;
               connect-src 'self' https://opqevxlhtrzlsuksggzi.supabase.co;
               base-uri 'none';
               form-action 'none';
               object-src 'none'"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Portal de Clientes · RetSolution</title>
    <!-- El icono es el de la empresa (RetSolution desde el 2026-11-01, antes
         MBA), no el de IMP: la pestaña la mira su cliente. Los archivos viven en
         portal/public/ y salen de assets/icono-retsolution.png de la app. -->
    <link rel="icon" href="./retsolution.ico" sizes="any" />
    <link rel="icon" type="image/png" href="./retsolution.png" />
    <link rel="apple-touch-icon" href="./retsolution.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap"
    />
    <script type="module" crossorigin src="./assets/index-BCrp5T1f.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-4OkbWadg.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
